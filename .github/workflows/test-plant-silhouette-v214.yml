name: Integrate sleeve plant silhouette v214
on:
  push:
    branches: [feature/sleeve-plant-silhouette-v214]
    paths: [.github/workflows/test-plant-silhouette-v214.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Integrate into standalone game
        run: python3 features/integrate-plant-silhouette-v214.py
      - name: Install Chromium and run regressions
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          node features/test-plant-silhouette-v214.cjs
          node features/test-wrap-layers-v213.cjs
          node features/test-african-v212.cjs
          node features/browser-smoke.cjs
      - name: Commit verified HTML to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: keep foliage inside bouquet sleeve v0.15.214"
          git push
