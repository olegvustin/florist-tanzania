name: Integrate natural foliage v218
on:
  push:
    branches: [feature/natural-greenery-v218]
    paths: [.github/workflows/test-natural-greenery-v218.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 features/integrate-natural-greenery-v218.py
      - name: Check foliage, sleeve clipping and game
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          node features/test-natural-greenery-v218.cjs
          node features/test-plant-silhouette-v214.cjs
          node features/browser-smoke.cjs
      - name: Commit verified HTML to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: give the three greens individual natural silhouettes v0.15.218"
          git push
