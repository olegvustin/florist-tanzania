name: Integrate bouquet harmony seating v215
on:
  push:
    branches: [feature/harmony-seating-v215]
    paths: [.github/workflows/test-harmony-seating-v215.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preserve baseline and integrate change
        run: |
          cp index.html baseline.html
          python3 features/integrate-harmony-seating-v215.py
      - name: Test all three arrangements and sleeve clipping
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          node features/test-harmony-seating-v215.cjs
          node features/test-plant-silhouette-v214.cjs
          node features/browser-smoke.cjs
      - name: Commit verified HTML to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: seat automatic bouquet presets lower v0.15.215"
          git push
