name: Check live Florist Tanzania launch
on:
  push:
    branches: [qa/live-launch-check-20261127]
    paths: [.github/workflows/qa-live-launch.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Inspect live GitHub Pages and Tilda
        run: node features/qa-live-launch.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: florist-tanzania-live-launch-report
          path: features/live-launch-report.json
